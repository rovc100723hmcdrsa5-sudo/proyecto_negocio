{% extends 'base.html' %}
{% block title %}Iniciar Sesión{% endblock %}
{% block content %}
<div class="card" style="max-width: 400px; margin: 0 auto;">
    <h2>Iniciar Sesión</h2>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn btn-primary">Entrar</button>
    </form>
    {% if form.errors %}
        <p style="color: #dc2626; margin-top: 10px;">Usuario o contraseña incorrectos.</p>
    {% endif %}
</div>
{% endblock %}
